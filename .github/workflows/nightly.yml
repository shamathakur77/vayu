name: nightly-forecast

on:
  schedule:
    # 21:45 UTC = 03:15 IST. GitHub cron drifts by a few minutes
    # under load; the pipeline does not care.
    - cron: "45 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vayu-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run nightly pipeline
        id: pipeline
        continue-on-error: true
        env:
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          OPENAQ_KEY: ${{ secrets.OPENAQ_KEY }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
        run: python -m pipeline.run_nightly

      - name: Render cards
        id: cards
        continue-on-error: true
        run: python -m cards.render_cards

      # Commit whatever succeeded even if something above failed:
      # partial data plus a red run beats losing the night.
      - name: Commit results
        run: |
          git config user.name "vayu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data out backtest
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "nightly: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Fail loudly if any step failed
        if: steps.pipeline.outcome == 'failure' || steps.cards.outcome == 'failure'
        run: |
          echo "::error::Nightly run had failures (pipeline=${{ steps.pipeline.outcome }}, cards=${{ steps.cards.outcome }}). Check the logs above. Next night's run will backfill automatically."
          exit 1
