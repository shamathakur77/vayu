name: backtest

on:
  workflow_dispatch:
    inputs:
      eval_start:
        description: "Evaluation start (YYYY-MM-DD)"
        required: false
        default: "2025-10-01"
      eval_end:
        description: "Evaluation end (YYYY-MM-DD)"
        required: false
        default: "2026-02-28"

permissions:
  contents: write

concurrency:
  group: vayu-pipeline
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run walk-forward backtest
        id: bt
        continue-on-error: true
        run: |
          python -m backtest.run_backtest \
            --eval-start "${{ inputs.eval_start }}" \
            --eval-end "${{ inputs.eval_end }}"

      - name: Commit report
        run: |
          git config user.name "vayu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/results.json backtest/REPORT.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "backtest: ${{ inputs.eval_start }} to ${{ inputs.eval_end }}"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Fail if model lost to persistence
        if: steps.bt.outcome == 'failure'
        run: |
          echo "::error::Backtest failed or model lost to the naive baseline. See backtest/REPORT.md."
          exit 1
