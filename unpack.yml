name: unpack

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.VAYU_PAT }}

      - name: Unpack VAYU
        run: |
          test -f vayu.zip || { echo "::error::vayu.zip not found in the repo root. Upload it first."; exit 1; }
          unzip -o vayu.zip -d .
          rm -f vayu.zip
          rm -f .github/workflows/unpack.yml

      - name: Commit the real repo
        run: |
          git config user.name "vayu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "import VAYU: pipeline, workflows, site, comparison library"
          git push
